<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Halberd emblem: white shaft and spike, cyan axe blade, gray back hook, inside a guilloche-style ring. -->
  <rect width="512" height="512" fill="#0E0F11"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#30353A" stroke-width="3"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#30353A" stroke-width="1.5" stroke-dasharray="2 8"/>
  <!-- spike -->
  <path d="M256 70 L271 150 L241 150 Z" fill="#FFFFFF"/>
  <!-- shaft -->
  <rect x="247" y="150" width="18" height="300" fill="#FFFFFF"/>
  <!-- axe blade -->
  <path d="M265 168 L338 132 Q392 210 338 290 L265 254 Z" fill="#6FE3EE"/>
  <!-- back hook -->
  <path d="M247 186 L172 170 Q196 200 186 238 L247 222 Z" fill="#8D9399"/>
  <!-- collars -->
  <rect x="235" y="266" width="42" height="10" fill="#FFFFFF"/>
  <rect x="235" y="284" width="42" height="4" fill="#FFFFFF"/>
</svg>
