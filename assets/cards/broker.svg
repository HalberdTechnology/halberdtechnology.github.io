    <linearGradient id="holo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE2E6" stop-opacity="0.35"/><stop offset="1" stop-color="#DDE2E6" stop-opacity="0.05"/>
