    <radialGradient id="halo" cx="100" cy="90" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B0B8" stop-opacity="0.3"/><stop offset="1" stop-color="#A9B0B8" stop-opacity="0"/>
