    </linearGradient>
    <radialGradient id="lensB" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#9AA1A9"/><stop offset="1" stop-color="#3B4148"/>
