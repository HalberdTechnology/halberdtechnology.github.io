#8D949C" stroke="none"/><path d="M16 160 L16 184 L40 184"/><circle cx="40" cy="184" r="1.8" fill="#8D949C" stroke="none"/><path d="M112 208 L88 208 L88 224 L64 224 L64 248"/><circle cx="64" cy="248" r="1.8" fill="#8D949C" stroke="none"/><path d="M0 88 L-32 88 L0 88 L0 104"/><circle cx="0" cy="104" r="1.8" fill="#8D949C" stroke="none"/><path d="M80 96 L96 96 L96 112 L96 128 L120 128"/><circle cx="120" cy="128" r="1.8" fill="#8D949C" stroke="none"/><path d="M8 176 L8 192 L32 192"/><circle cx="32" cy="192" r="1.8" fill="#8D949C" stroke="none"/><path d="M48 208 L80 208 L104 208 L80 208"/><circle cx="80" cy="208" r="1.8" fill="#8D949C" stroke="none"/><path d="M152 8 L152 32 L152 16 L136 16 L136 32"/><circle cx="136" cy="32" r="1.8" fill="#8D949C" stroke="none"/><path d="M192 32 L192 8 L208 8"/><circle cx="208" cy="8" r="1.8" fill="#8D949C" stroke="none"/></g>
