 43.6 L63.8 -47.2" stroke-opacity="0.32"/><path d="M94.0 42.4 L85.6 -21.1" stroke-opacity="0.18"/><path d="M100.0 42.0 L100.0 -52.0" stroke-opacity="0.32"/><path d="M106.0 42.4 L114.4 -21.1" stroke-opacity="0.18"/><path d="M111.9 43.6 L136.2 -47.2" stroke-opacity="0.32"/><path d="M117.6 45.5 L142.1 -13.6" stroke-opacity="0.18"/><path d="M123.0 48.2 L170.0 -33.2" stroke-opacity="0.32"/><path d="M128.0 51.5 L167.0 0.7" stroke-opacity="0.18"/><path d="M132.5 55.5 L199.0 -11.0" stroke-opacity="0.32"/><path d="M136.5 60.0 L187.3 21.0" stroke-opacity="0.18"/><path d="M139.8 65.0 L221.2 18.0" stroke-opacity="0.32"/><path d="M142.5 70.4 L201.6 45.9" stroke-opacity="0.18"/><path d="M144.4 76.1 L235.2 51.8" stroke-opacity="0.32"/><path d="M145.6 82.0 L209.1 73.6" stroke-opacity="0.18"/></g>
