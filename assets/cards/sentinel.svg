<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <!-- Sentinel: circlet and jewel, eyes closed, a hex shield; rays and a dome of protection -->
  <defs>
    <clipPath id="card"><rect width="200" height="280" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3036"/><stop offset="0.6" stop-color="#121417"/><stop offset="1" stop-color="#08090A"/>
    </linearGradient>
    <radialGradient id="halo" cx="100" cy="90" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B0B8" stop-opacity="0.3"/><stop offset="1" stop-color="#A9B0B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14171A"/><stop offset="0.62" stop-color="#2A2F34"/><stop offset="1" stop-color="#6B727A"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0C0E"/><stop offset="0.7" stop-color="#1B1F23"/><stop offset="1" stop-color="#3B4148"/>
    </linearGradient>
    <linearGradient id="clothL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B4148"/><stop offset="0.3" stop-color="#1B1F23"/><stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090A" stop-opacity="0"/><stop offset="0.35" stop-color="#08090A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0C0E"/><stop offset="0.75" stop-color="#1F2327"/><stop offset="1" stop-color="#5C636B"/>
    </linearGradient>
    <radialGradient id="jewel" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#6B727A"/>
    </radialGradient>
  </defs>
