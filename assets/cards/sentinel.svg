    <rect width="200" height="280" fill="url(#scan)"/>
    <rect x="0" y="214" width="200" height="66" fill="url(#plate)"/>
    <path d="M24 236 H176" stroke="#EEF1F3" stroke-opacity="0.35" stroke-width="0.8"/>
    <path d="M52 256 H78 M122 256 H148" stroke="#EEF1F3" stroke-opacity="0.6" stroke-width="1.2"/>
